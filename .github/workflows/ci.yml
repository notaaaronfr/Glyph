name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install the kernel toolchain (QEMU, clang, lld)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm clang lld
          echo "GLYPH_KERNEL_CC=clang" >> "$GITHUB_ENV"
          echo "GLYPH_REQUIRE_KERNEL=1" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --release --workspace --all-targets --locked -- -D warnings
      - name: Test (interpreter, native and kernel backends, red-team cases)
        run: cargo test --release --workspace --locked
      - name: Trusted base (needs jq, which the runners include)
        run: scripts/tcb.sh
